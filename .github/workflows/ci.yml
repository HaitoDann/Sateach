name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "CHANGELOG.md"
      - "docs/**"
      - "LICENSE"

# Cancel an in-progress run when a newer commit is pushed to the same ref,
# so superseded runs don't keep eating minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
