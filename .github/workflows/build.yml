name: Build Windows

# Builds the Windows installers (.exe NSIS + .msi).
# - Manual run (Actions › Build Windows › Run workflow): the installers are
#   attached to the run as a downloadable artifact.
# - Every push to main: the release `v<version>` (version from
#   tauri.conf.json) is created or updated with the installers attached.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Sat'each v__VERSION__"
          releaseDraft: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: sateach-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
